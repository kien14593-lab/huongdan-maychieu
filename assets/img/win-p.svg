<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 460" width="380" height="460" role="img" aria-labelledby="title desc">
  <title id="title">Bảng chọn chế độ trình chiếu khi nhấn Windows + P (minh họa)</title>
  <desc id="desc">Bốn lựa chọn: PC screen only, Duplicate (khuyên dùng), Extend, Second screen only.</desc>
<rect x="10" y="10" width="360" height="440" rx="14" fill="#1f2430" stroke="#0b0d12" stroke-width="2"/>
<text x="30.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#c9d1e0" text-anchor="start">PROJECT / TRÌNH CHIẾU</text>
<rect x="36" y="88" width="30" height="22" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<rect x="74" y="88" width="30" height="22" rx="3" fill="none" stroke="#ffffff" stroke-width="2"/>
<text x="120.0" y="102.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">PC screen only</text>
<text x="120.0" y="126.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#aab4c5" text-anchor="start">Chỉ màn hình PC – máy chiếu KHÔNG có hình</text>
<rect x="20" y="162" width="340" height="82" rx="10" fill="#0b3d91"/>
<rect x="36" y="180" width="30" height="22" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<rect x="74" y="180" width="30" height="22" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<line x1="42" y1="188" x2="60" y2="188" stroke="#0b3d91" stroke-width="2"/>
<line x1="42" y1="194" x2="60" y2="194" stroke="#0b3d91" stroke-width="2"/>
<line x1="80" y1="188" x2="98" y2="188" stroke="#0b3d91" stroke-width="2"/>
<line x1="80" y1="194" x2="98" y2="194" stroke="#0b3d91" stroke-width="2"/>
<text x="120.0" y="194.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Duplicate</text>
<text x="120.0" y="218.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#dbe3f0" text-anchor="start">Nhân đôi – khuyên dùng khi giảng dạy</text>
<rect x="36" y="272" width="30" height="22" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<rect x="74" y="272" width="30" height="22" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<line x1="42" y1="283" x2="98" y2="283" stroke="#1f2430" stroke-width="3"/>
<text x="120.0" y="286.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Extend</text>
<text x="120.0" y="310.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#aab4c5" text-anchor="start">Mở rộng – dùng Presenter View trong PowerPoint</text>
<rect x="36" y="364" width="30" height="22" rx="3" fill="none" stroke="#ffffff" stroke-width="2"/>
<rect x="74" y="364" width="30" height="22" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="120.0" y="378.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Second screen only</text>
<text x="120.0" y="402.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#aab4c5" text-anchor="start">Chỉ màn hình thứ hai – màn laptop tắt</text>
<text x="190.0" y="430.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#c9d1e0" text-anchor="middle">Nhấn phím  Windows + P  để mở bảng này</text>
</svg>
