  <title id="title">Sơ đồ remote Hitachi R017H (màu đen) – vẽ theo remote thật</title>
  <desc id="desc">Hàng trên: VIDEO, COMPUTER, MY SOURCE/DOC.CAMERA và nút nguồn đỏ. Tiếp theo: ASPECT, AUTO, SEARCH, BLANK; MAGNIFY ON/OFF, FREEZE, PAGE UP/DOWN, VOLUME; KEYSTONE, MY BUTTON 1/2, MUTE; FOCUS, D-ZOOM; POSITION, MENU; vòng mũi tên với ENTER ở giữa; ESC và RESET ở dưới.</desc>
