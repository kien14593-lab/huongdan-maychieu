<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ kết nối máy chiếu tương tác Infoto (minh họa)</title>
  <desc id="desc">Máy chiếu siêu gần treo phía trên bảng; laptop nối bằng cáp HDMI (hình) và cáp USB (tương tác); tránh nắng chiếu thẳng vào bảng.</desc>
<rect x="0" y="0" width="640" height="380" fill="#ffffff"/>
<rect x="40" y="110" width="300" height="190" rx="6" fill="#f3f5f9" stroke="#5b6470" stroke-width="3"/>
<text x="190.0" y="290.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">Bảng / màn chiếu tương tác</text>
<rect x="150" y="40" width="80" height="34" rx="6" fill="#2f3237" stroke="#15171a" stroke-width="2"/>
<rect x="186" y="20" width="8" height="20" fill="#5b6470"/>
<rect x="120" y="14" width="140" height="8" rx="3" fill="#5b6470"/>
<text x="190.0" y="62.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">Máy chiếu Infoto</text>
<polygon points="190,74 50,120 330,120" fill="#ffe8a3" opacity="0.7"/>
<polygon points="190,74 50,120 50,290 330,290 330,120" fill="#fff4cc" opacity="0.5"/>
<rect x="170" y="74" width="40" height="8" rx="3" fill="#0f766e"/>
<text x="266.0" y="84.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="400" fill="#0f766e" text-anchor="start">Cảm biến chạm (giữ sạch,</text>
<text x="266.0" y="96.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="400" fill="#0f766e" text-anchor="start">không che, tránh nắng)</text>
<line x1="100" y1="250" x2="150" y2="200" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/>
<circle cx="98" cy="252" r="5" fill="#c8102e"/>
<text x="105.0" y="275.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="400" fill="#0f766e" text-anchor="middle">Bút tương tác (có pin)</text>
<circle cx="590" cy="50" r="22" fill="#f6c343"/>
<line x1="618.0" y1="50.0" x2="628.0" y2="50.0" stroke="#f6c343" stroke-width="4" stroke-linecap="round"/>
<line x1="609.8" y1="69.8" x2="616.9" y2="76.9" stroke="#f6c343" stroke-width="4" stroke-linecap="round"/>
<line x1="590.0" y1="78.0" x2="590.0" y2="88.0" stroke="#f6c343" stroke-width="4" stroke-linecap="round"/>
<line x1="570.2" y1="69.8" x2="563.1" y2="76.9" stroke="#f6c343" stroke-width="4" stroke-linecap="round"/>
<line x1="562.0" y1="50.0" x2="552.0" y2="50.0" stroke="#f6c343" stroke-width="4" stroke-linecap="round"/>
<line x1="570.2" y1="30.2" x2="563.1" y2="23.1" stroke="#f6c343" stroke-width="4" stroke-linecap="round"/>
<line x1="590.0" y1="22.0" x2="590.0" y2="12.0" stroke="#f6c343" stroke-width="4" stroke-linecap="round"/>
<line x1="609.8" y1="30.2" x2="616.9" y2="23.1" stroke="#f6c343" stroke-width="4" stroke-linecap="round"/>
<text x="590.0" y="106.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="700" fill="#b7791f" text-anchor="middle">Nắng chiếu thẳng vào bảng</text>
<text x="590.0" y="118.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="400" fill="#b7791f" text-anchor="middle">→ chạm bị nhiễu, kéo rèm</text>
<rect x="420" y="200" width="150" height="90" rx="6" fill="#e3e7ec" stroke="#5b6470" stroke-width="3"/>
<rect x="432" y="210" width="126" height="70" rx="3" fill="#0b3d91"/>
<rect x="400" y="290" width="190" height="12" rx="4" fill="#c7ced8" stroke="#5b6470" stroke-width="2"/>
<text x="495.0" y="320.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">Laptop giảng viên</text>
<path d="M230 52 C 330 52, 360 150, 420 230" fill="none" stroke="#0b3d91" stroke-width="5"/>
<path d="M230 64 C 320 70, 350 190, 420 250" fill="none" stroke="#0f766e" stroke-width="5" stroke-dasharray="10 6"/>
<rect x="330" y="30" width="122" height="22" rx="6" fill="#0b3d91"/>
<text x="391.0" y="45.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1. Cáp HDMI → hình</text>
<rect x="290" y="150" width="150" height="22" rx="6" fill="#0f766e"/>
<text x="365.0" y="165.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2. Cáp USB → bút/chạm</text>
<text x="320.0" y="360.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="700" fill="#1b1f24" text-anchor="middle">Máy chiếu tương tác cần CẢ HAI dây: thiếu dây USB thì chạm/bút không hoạt động.</text>
</svg>
