<circle cx="95" cy="110" r="20" fill="#1b3a6b"/>
<circle cx="88" cy="102" r="6" fill="#7fa7e0" opacity="0.8"/>
<text x="95.0" y="178.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="400" fill="#1b1f24" text-anchor="middle">Ống kính + vòng Focus/Zoom</text>
<rect x="560" y="40" width="40" height="140" rx="6" fill="#c7ced8" stroke="#5b6470" stroke-width="1.5"/>
<line x1="566" y1="52" x2="594" y2="52" stroke="#5b6470" stroke-width="3"/>
