<text x="320.0" y="225.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="400" fill="#333" text-anchor="middle">Sơ đồ minh họa mặt trên máy chiếu Hitachi – vị trí thực tế tùy model.</text>
<text x="320.0" y="241.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="400" fill="#333" text-anchor="middle">Máy treo trần: các nút này nằm phía trên, thường phải dùng remote.</text>
