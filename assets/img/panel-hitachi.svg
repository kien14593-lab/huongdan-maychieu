<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ bảng điều khiển trên thân máy chiếu Hitachi (minh họa)</title>
  <desc id="desc">Bảng điều khiển gồm đèn báo POWER, TEMP, LAMP và các nút STANDBY/ON, INPUT, MENU, mũi tên, ENTER.</desc>
<rect x="20" y="20" width="600" height="180" rx="18" fill="#e3e7ec" stroke="#5b6470" stroke-width="3"/>
<circle cx="95" cy="110" r="48" fill="#2f3237" stroke="#15171a" stroke-width="3"/>
