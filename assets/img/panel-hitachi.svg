<line x1="566" y1="124" x2="594" y2="124" stroke="#5b6470" stroke-width="3"/>
<line x1="566" y1="142" x2="594" y2="142" stroke="#5b6470" stroke-width="3"/>
<line x1="566" y1="160" x2="594" y2="160" stroke="#5b6470" stroke-width="3"/>
<text x="580.0" y="195.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="400" fill="#1b1f24" text-anchor="middle">Khe gió – không che</text>
<text x="170.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="700" fill="#1b1f24" text-anchor="start">Đèn báo</text>
